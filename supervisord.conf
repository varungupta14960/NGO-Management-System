[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:backend]
command=java -jar /opt/aegis/backend.jar
directory=/opt/aegis
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
environment=DB_URL="jdbc:mysql://127.0.0.1:3306/ngo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC",DB_USER="aegis",DB_PASSWORD="aegis",FRONTEND_URL="http://127.0.0.1"

[program:frontend]
command=node /opt/aegis/frontend/server.js
directory=/opt/aegis/frontend
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
environment=PORT="3000",HOSTNAME="127.0.0.1",NEXT_PUBLIC_API_URL="/api"
